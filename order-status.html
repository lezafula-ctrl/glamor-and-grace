<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order | Glamor & Grace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="announcement">
        ✨ Glamor & Grace — Glamour for every occasion, Grace for everyday ✨
    </div>


    <header class="main-header">

        <div class="header-top">

            <button class="menu-button" aria-label="Open menu">
                ☰
            </button>

            <a href="index.html" class="logo-link">
                <img
                    src="logo.png"
                    alt="Glamor & Grace Logo"
                    class="logo"
                >
            </a>

            <div class="header-icons">

                <a href="shop.html" class="icon-button">
                    🛍️
                </a>

                <a href="cart.html" class="cart-link">
                    🛒
                    <span id="cart-count">0</span>
                </a>

            </div>

        </div>

    </header>


    <main>

        <section class="order-status-page">

            <div class="section-heading">

                <div>

                    <p class="section-label">
                        GLAMOR & GRACE
                    </p>

                    <h1>
                        Track My Order
                    </h1>

                </div>

            </div>


            <form id="order-search-form">

                <label for="order-number">
                    Order Number
                </label>

                <input
                    type="text"
                    id="order-number"
                    placeholder="e.g. GG-10001"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Track Order
                </button>

            </form>


            <div
                id="order-result"
                class="order-result"
            >
                <p>
                    Enter your order number above to track your order.
                </p>
            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="footer-brand">

            <img
                src="logo.png"
                alt="Glamor & Grace Logo"
            >

            <p>
                Glamour for every occasion,<br>
                Grace for everyday.
            </p>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 Glamor & Grace. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/app.js"></script>

</body>
</html>

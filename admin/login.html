<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Glamor & Grace</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
</head>
<body>
    <main class="admin-login-page">
        <div class="admin-login-card">
            <img src="../logo.png" alt="Glamor & Grace Logo" class="admin-logo">
            <p class="section-label">GLAMOR & GRACE</p>
            <h1>Admin Login</h1>
            <p>Sign in to manage your store.</p>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-email">Email</label>
                    <input type="email" id="admin-email" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" required>
                </div>
                <button type="submit" class="primary-button">Sign In</button>
                <p>Need staff access? <a href="staff-signup.html">Create a staff account</a></p>
                <p id="login-message" role="status"></p>
            </form>
        </div>
    </main>
    <script>
    document.getElementById("admin-login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("admin-email").value.trim();
        const password = document.getElementById("admin-password").value;
        const message = document.getElementById("login-message");
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        message.textContent = "Signing in...";
        try {
            const { data, error } = await ggSupabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            const user = data.user;
            if (!user) throw new Error("We could not verify this account. Please try again.");

            let { data: adminUser, error: profileError } = await ggSupabase
                .from("admin_users")
                .select("role")
                .eq("id", user.id)
                .maybeSingle();

            if (profileError) throw profileError;

            if (!adminUser) {
                const { error: insertError } = await ggSupabase
                    .from("admin_users")
                    .insert({ id: user.id, email: user.email || email, role: "pending" });
                if (insertError) throw insertError;
                adminUser = { role: "pending" };
            }

            if (adminUser.role === "pending") {
                await ggSupabase.auth.signOut();
                message.textContent = "Your account is confirmed, but staff access is waiting for Owner approval. Please try again after the Owner approves your account.";
                button.disabled = false;
                return;
            }

            if (adminUser.role !== "owner" && adminUser.role !== "staff") {
                await ggSupabase.auth.signOut();
                throw new Error("This account does not have permission to access the dashboard.");
            }

            window.location.href = "dashboard.html";
        } catch (error) {
            console.error("Admin login error:", error);
            message.textContent = error.message || "Login failed. Please check your email and password.";
            button.disabled = false;
        }
    });
    </script>
</body>
</html>

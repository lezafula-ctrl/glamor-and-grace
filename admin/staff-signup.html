<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Sign Up | Glamor & Grace</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
</head>
<body>
    <main class="admin-login-page">
        <div class="admin-login-card">
            <p class="section-label">GLAMOR & GRACE</p>
            <h1>Staff Sign Up</h1>
            <p>Create your account to request staff access.</p>
            <form id="staff-signup-form">
                <div class="form-group">
                    <label for="staff-email">Email</label>
                    <input type="email" id="staff-email" required>
                </div>
                <div class="form-group">
                    <label for="staff-password">Password</label>
                    <input type="password" id="staff-password" required minlength="6">
                </div>
                <button type="submit" class="primary-button">Create Account</button>
                <button type="button" id="resend-confirmation" class="secondary-button">Resend confirmation email</button>
                <p id="signup-message" role="status"></p>
            </form>
        </div>
    </main>
    <script>
    document.getElementById("staff-signup-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const email = document.getElementById("staff-email").value.trim();
        const password = document.getElementById("staff-password").value;
        const message = document.getElementById("signup-message");
        const button = event.currentTarget.querySelector('button[type="submit"]');
        button.disabled = true;
        message.textContent = "Creating account...";
        try {
            const { data, error } = await ggSupabase.auth.signUp({
                email,
                password,
                options: {
                    emailRedirectTo: "https://lezafula-ctrl.github.io/glamor-and-grace/admin/login.html"
                }
            });
            if (error) throw error;
            if (data.user && !data.session) {
                message.textContent = "Account created. Please check your email and confirm your address. You can then sign in to request staff access. The Owner must approve your access before you can use the dashboard.";
            } else if (data.user) {
                message.textContent = "Account created. Please sign in to request staff access. The Owner must approve your access before you can use the dashboard.";
            } else {
                message.textContent = "Please check your email to continue.";
            }
        } catch (error) {
            console.error("Staff signup error:", error);
            message.textContent = error.message || "Could not create the account. Please try again.";
            button.disabled = false;
        }
    });
        document.getElementById("resend-confirmation").addEventListener("click", async () => {
            const email = document.getElementById("staff-email").value.trim();
            const message = document.getElementById("signup-message");
            if (!email) {
                message.textContent = "Please enter the email address you used to create the account.";
                return;
            }
            const resendButton = document.getElementById("resend-confirmation");
            resendButton.disabled = true;
            message.textContent = "Sending a new confirmation email...";
            try {
                const { error } = await ggSupabase.auth.resend({
                    type: "signup",
                    email,
                    options: {
                        emailRedirectTo: "https://lezafula-ctrl.github.io/glamor-and-grace/admin/login.html"
                    }
                });
                if (error) throw error;
                message.textContent = "If this address has an unconfirmed account, a new confirmation email has been sent. Please check your inbox and spam folder.";
            } catch (error) {
                console.error("Resend confirmation error:", error);
                message.textContent = error.message || "Could not resend the confirmation email. Please try again.";
            } finally {
                resendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
